name: ApkBuilder Agent

on:
  workflow_dispatch:
    inputs:
      backend_url:
        description: 'Backend WebSocket URL'
        required: true
        type: string
      account_id:
        description: 'GitHub account ID'
        required: true
        type: string
      user_id:
        description: 'User ID'
        required: true
        type: string
      session_id:
        description: 'Session ID'
        required: true
        type: string
      duration_minutes:
        description: 'Session duration in minutes'
        required: true
        type: number
        default: 60

jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build agent
        run: |
          cd agent-go
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o ../agent-agent-linux-amd64 -ldflags="-s -w" .

      - name: Start Agent
        env:
          BACKEND_URL: ${{ github.event.inputs.backend_url }}
          ACCOUNT_ID: ${{ github.event.inputs.account_id }}
          USER_ID: ${{ github.event.inputs.user_id }}
          SESSION_ID: ${{ github.event.inputs.session_id }}
          DURATION_MINUTES: ${{ github.event.inputs.duration_minutes }}
        run: ./agent-agent-linux-amd64
