name: ApkBuilder Agent

on:
  workflow_dispatch:
    inputs:
      backend_url:
        description: 'Backend WebSocket URL'
        required: true
        type: string
      account_id:
        description: 'GitHub account ID'
        required: true
        type: string
      user_id:
        description: 'User ID'
        required: true
        type: string
      session_id:
        description: 'Session ID'
        required: true
        type: string
      duration_minutes:
        description: 'Session duration in minutes'
        required: true
        type: number
        default: 60

jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event.inputs.duration_minutes }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: cd agent && npm install

      - name: Start Agent
        env:
          BACKEND_URL: ${{ github.event.inputs.backend_url }}
          ACCOUNT_ID: ${{ github.event.inputs.account_id }}
          USER_ID: ${{ github.event.inputs.user_id }}
          SESSION_ID: ${{ github.event.inputs.session_id }}
          DURATION_MINUTES: ${{ github.event.inputs.duration_minutes }}
        run: cd agent && node index.js
